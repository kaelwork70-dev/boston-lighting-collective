<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy rounded background -->
  <rect width="32" height="32" rx="7" fill="#0d1b2a"/>

  <!-- String wire -->
  <path d="M3,10 Q10,15 16,10 Q22,5 29,10" stroke="#d4a833" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Center bulb (large) -->
  <line x1="16" y1="10" x2="16" y2="14" stroke="#d4a833" stroke-width="1.2"/>
  <rect x="14.2" y="12.5" width="3.6" height="2.2" rx="0.4" fill="#c8a030"/>
  <ellipse cx="16" cy="17.5" rx="3.8" ry="5" fill="#f0c84a"/>
  <!-- bulb shine -->
  <ellipse cx="14.8" cy="15.8" rx="0.9" ry="1.4" fill="#fff" opacity="0.35" transform="rotate(-15 14.8 15.8)"/>

  <!-- Left bulb (small) -->
  <line x1="8" y1="12.5" x2="8" y2="15.5" stroke="#d4a833" stroke-width="1"/>
  <rect x="6.5" y="14.2" width="3" height="1.8" rx="0.3" fill="#c8a030"/>
  <ellipse cx="8" cy="18.2" rx="3" ry="4" fill="#f0c84a" opacity="0.85"/>

  <!-- Right bulb (small) -->
  <line x1="24" y1="12.5" x2="24" y2="15.5" stroke="#d4a833" stroke-width="1"/>
  <rect x="22.5" y="14.2" width="3" height="1.8" rx="0.3" fill="#c8a030"/>
  <ellipse cx="24" cy="18.2" rx="3" ry="4" fill="#f0c84a" opacity="0.85"/>

  <!-- Skyline silhouette at bottom -->
  <g fill="#1e3050">
    <rect x="1"  y="24" width="4"  height="8"/>
    <rect x="5"  y="21" width="3"  height="11"/>
    <rect x="8"  y="25" width="3"  height="7"/>
    <rect x="11" y="20" width="4"  height="12"/>
    <polygon points="11,20 13,16 15,20" fill="#1e3050"/>
    <rect x="15" y="23" width="3"  height="9"/>
    <rect x="18" y="20" width="4"  height="12"/>
    <polygon points="18,20 20,16 22,20" fill="#1e3050"/>
    <rect x="22" y="24" width="3"  height="8"/>
    <rect x="25" y="21" width="3"  height="11"/>
    <rect x="28" y="25" width="3"  height="7"/>
  </g>

  <!-- Gold glow under bulbs -->
  <ellipse cx="16" cy="20" rx="10" ry="3" fill="#d4a833" opacity="0.08"/>
</svg>
